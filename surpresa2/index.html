<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F0E6">
    <title>Em breve </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .carta-pagina { width: min(760px, 90%); margin: 55px auto; padding: clamp(24px, 6vw, 58px); background: var(--papel); border: 1px solid var(--borda); box-shadow: 0 12px 35px rgba(64,56,49,.08); }
        .carta-pagina h1 { margin: 12px 0 24px; color: var(--vinho); font-size: clamp(2rem, 5vw, 3rem); text-align: center; }
        .carta-pagina p { margin: 0 0 18px; color: #51473F; }
        .carta-pagina .saudacao { color: var(--verde); font-family: "Dancing Script", cursive; font-size: 2rem; }
        .carta-pagina .assinatura { margin-top: 30px; color: var(--vinho); font-family: "Dancing Script", cursive; font-size: 2rem; text-align: right; }
        .voltar { display: block; width: fit-content; margin: 28px auto 0; }
    </style>
</head>
<body>
    <header class="cabecalho">
        <h1>EM BREVE</h1>
        <div class="divisor" aria-hidden="true"><span></span> ♥ <span></span></div>
    </header>

    <footer class="rodape">
        <p>Feito com amor — Dudu ♥</p>
    </footer>
</body>
</html>
